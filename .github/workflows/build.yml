name: Build FishIPA

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/edgetunnel/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate project metadata
        run: plutil -lint ExportOptions.plist FishIPA/Resources/Info.plist FishIPA/FishIPA.entitlements

      - name: Build archive
        run: |
          xcodebuild archive \
            -project FishIPA.xcodeproj \
            -scheme FishIPA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FishIPA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA for TrollStore
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/FishIPA.xcarchive/Products/Applications/FishIPA.app build/ipa/Payload/FishIPA.app
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 鱼儿优选" build/ipa/Payload/FishIPA.app/Info.plist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/FishIPA.ipa

      - name: Upload IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: FishIPA-${{ github.sha }}
          path: |
            build/FishIPA.ipa
            build/FishIPA.xcarchive
