name: Build FishIPA

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/edgetunnel/**"
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate project metadata
        run: plutil -lint ExportOptions.plist FishIPA/Resources/Info.plist FishIPA/FishIPA.entitlements

      - name: Build archive
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project FishIPA.xcodeproj \
            -scheme FishIPA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FishIPA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA for TrollStore
        run: |
          mkdir -p build/ipa/Payload
          app_path=$(find build/FishIPA.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app_path"
          cp -R "$app_path" build/ipa/Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/FishIPA.ipa

      - name: Upload IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: FishIPA-${{ github.sha }}
          path: |
            build/FishIPA.ipa
            build/FishIPA.xcarchive

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_id }}
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish compiler errors
        if: failure()
        run: |
          grep -E "error:|fatal error:|BUILD FAILED" build/xcodebuild.log | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          {
            echo "## xcodebuild diagnostics"
            grep -E "error:|fatal error:|BUILD FAILED" build/xcodebuild.log || true
          } >> "$GITHUB_STEP_SUMMARY"

  retry-on-failure:
    needs: build
    if: ${{ failure() && github.run_attempt < 2 }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Download logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery-logs
          gh run view "${{ github.run_id }}" --log-failed > recovery-logs/build-failed.log || true

      - name: Upload failed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-${{ github.run_id }}
          path: recovery-logs
          retention-days: 14
          if-no-files-found: ignore

      - name: Retry failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Build failed; retrying failed jobs for workflow ${{ github.run_id }}"
          gh run rerun "${{ github.run_id }}" --failed --repo "${GITHUB_REPOSITORY}"
