name: Scheduled Cloudflare Scan

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      sample_per_network:
        description: "IPv6 samples per official network"
        required: false
        default: "2"

permissions:
  actions: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Cloudflare scan
        run: |
          python3 Scripts/cloudflare_scan.py \
            --sample-per-network "${{ inputs.sample_per_network || '2' }}" \
            --workers 150 \
            --timeout 1.5

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-scan-${{ github.run_number }}
          path: build/results.*
          retention-days: 14

  retry-on-failure:
    needs: scan
    if: ${{ failure() && github.run_attempt < 2 }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Download logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery-logs
          gh run view "${{ github.run_id }}" --log-failed > recovery-logs/scan-failed.log || true

      - name: Upload failed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-failure-logs-${{ github.run_id }}
          path: recovery-logs
          retention-days: 14
          if-no-files-found: ignore

      - name: Retry failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Scan failed; retrying failed jobs for workflow ${{ github.run_id }}"
          gh run rerun "${{ github.run_id }}" --failed --repo "${GITHUB_REPOSITORY}"
