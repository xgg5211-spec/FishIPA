name: Release FishIPA for TrollStore

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate project metadata
        run: plutil -lint ExportOptions.plist FishIPA/Resources/Info.plist FishIPA/FishIPA.entitlements

      - name: Build unsigned IPA
        run: |
          xcodebuild archive \
            -project FishIPA.xcodeproj \
            -scheme FishIPA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FishIPA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/ipa/Payload
          cp -R build/FishIPA.xcarchive/Products/Applications/FishIPA.app build/ipa/Payload/FishIPA.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 小鱼优选" build/ipa/Payload/FishIPA.app/Info.plist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/FishIPA.ipa

      - name: Upload IPA as GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/FishIPA.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
