name: Update EdgeTunnel IP Pool

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      sample_per_network:
        description: "TLS samples per Cloudflare network"
        required: false
        default: "1"
      max_candidates:
        description: "Maximum IPs to test"
        required: false
        default: "12000"

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout FishIPA
        uses: actions/checkout@v4

      - name: Build TLS-verified EdgeTunnel pool
        run: |
          python3 Scripts/update_edgetunnel_ip_pool.py \
            --sample-per-network "${{ inputs.sample_per_network || '1' }}" \
            --max-candidates "${{ inputs.max_candidates || '12000' }}" \
            --keep 1000 \
            --workers 300 \
            --timeout 1.5

      - name: Validate clean EdgeTunnel entries
        run: |
          test -s data/edgetunnel/ADD.txt
          test -s data/edgetunnel/source_ipv4.txt
          test -s data/edgetunnel/source_ipv6.txt
          test -s data/edgetunnel/results.json
          if grep -Eq '#|ms' data/edgetunnel/ADD.txt; then
            echo "ADD.txt must contain clean IP:port entries without latency remarks"
            exit 1
          fi
          grep -Eq '^((([0-9]{1,3}\.){3}[0-9]{1,3})|\[[0-9A-Fa-f:]+\]):[0-9]{1,5}$' data/edgetunnel/ADD.txt

      - name: Commit updated IP pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edgetunnel
          if git diff --cached --quiet; then
            echo "IP pool unchanged"
          else
            git commit -m "chore: update TLS-verified EdgeTunnel IP pool"
            git push
          fi

      - name: Push pool to EdgeTunnel KV
        env:
          EDGETUNNEL_URL: ${{ secrets.EDGETUNNEL_URL }}
          EDGETUNNEL_ADMIN_PASSWORD: ${{ secrets.EDGETUNNEL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${EDGETUNNEL_URL}" ] || [ -z "${EDGETUNNEL_ADMIN_PASSWORD}" ]; then
            echo "EdgeTunnel Secrets not configured; keeping the pool in GitHub only"
            exit 0
          fi
          base_url="${EDGETUNNEL_URL%/}"
          cookie_file="$(mktemp)"
          trap 'rm -f "$cookie_file"' EXIT
          curl --fail-with-body --silent --show-error --location \
            --cookie-jar "$cookie_file" \
            --data-urlencode "password=${EDGETUNNEL_ADMIN_PASSWORD}" \
            "${base_url}/login" > /tmp/edgetunnel-login.json
          curl --fail-with-body --silent --show-error --location \
            --cookie "$cookie_file" \
            --header "Content-Type: text/plain; charset=utf-8" \
            --data-binary @data/edgetunnel/ADD.txt \
            "${base_url}/admin/ADD.txt"
          echo "EdgeTunnel ADD.txt KV updated"

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: edgetunnel-ip-pool-${{ github.run_number }}
          path: data/edgetunnel
          retention-days: 30

  retry-on-failure:
    needs: update
    if: ${{ failure() && github.run_attempt < 2 }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery-logs
          gh run view "${{ github.run_id }}" --log-failed > recovery-logs/edgetunnel-failed.log || true

      - name: Upload failed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgetunnel-failure-logs-${{ github.run_id }}
          path: recovery-logs
          retention-days: 14
          if-no-files-found: ignore

      - name: Retry failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "EdgeTunnel update failed; retrying failed jobs for workflow ${{ github.run_id }}"
          gh run rerun "${{ github.run_id }}" --failed --repo "${GITHUB_REPOSITORY}"
