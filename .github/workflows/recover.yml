name: Recover Failed FishIPA Workflow

on:
  workflow_run:
    workflows: ["Build FishIPA", "Scheduled Cloudflare Scan"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  recover:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.run_attempt < 2
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download failure logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p recovery-logs
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" \
            > recovery-logs/workflow-${RUN_ID}.zip

      - name: Upload failure logs
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.event.workflow_run.id }}
          path: recovery-logs/workflow-${{ github.event.workflow_run.id }}.zip
          retention-days: 14

      - name: Retry failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run rerun "${RUN_ID}" \
            --failed \
            --repo "${GITHUB_REPOSITORY}"
          echo "已自动重启失败任务；本次运行不会再次自动重启。"
